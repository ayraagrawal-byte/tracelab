services:
  api:
    build: .
    container_name: tracelab-api
    environment:
      DATABASE_URL: postgresql://tracelab:tracelab@postgres:5432/tracelab
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    container_name: tracelab-worker
    command: python -u -m app.worker
    environment:
      DATABASE_URL: postgresql://tracelab:tracelab@postgres:5432/tracelab
      REDIS_HOST: redis
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    container_name: tracelab-postgres
    environment:
      POSTGRES_USER: tracelab
      POSTGRES_PASSWORD: tracelab
      POSTGRES_DB: tracelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelab -d tracelab"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tracelab-redis

volumes:
  postgres_data:
