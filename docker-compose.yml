services:
  api:
    build: .
    container_name: tracelab-api
    environment:
      DATABASE_URL: postgresql://tracelab:tracelab@postgres:5432/tracelab
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    container_name: tracelab-worker
    command: python -u -m app.worker
    environment:
      DATABASE_URL: postgresql://tracelab:tracelab@postgres:5432/tracelab
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: tracelab-postgres
    environment:
      POSTGRES_USER: tracelab
      POSTGRES_PASSWORD: tracelab
      POSTGRES_DB: tracelab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tracelab-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: